name: Retrieval evals (nightly)

on:
  schedule:
    - cron: "0 3 * * *" # 09:00 Dhaka
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require staging evaluation configuration
        env:
          MIOS_TEST_DSN: ${{ secrets.STAGING_DATABASE_URL }}
          MIOS_EVAL_TENANT_ID: ${{ secrets.STAGING_EVAL_TENANT_ID }}
        run: |
          if [ -z "$MIOS_TEST_DSN" ] || [ -z "$MIOS_EVAL_TENANT_ID" ]; then
            echo "::error::Staging evaluation secrets are missing; retrieval was NOT evaluated."
            exit 1
          fi
      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Run golden-set evaluation against staging
        working-directory: apps/api
        env:
          MIOS_TEST_DSN: ${{ secrets.STAGING_DATABASE_URL }}
          MIOS_EVAL_TENANT_ID: ${{ secrets.STAGING_EVAL_TENANT_ID }}
        run: |
          python ../../evals/run_eval.py
