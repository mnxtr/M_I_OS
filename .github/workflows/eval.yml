name: Retrieval evals (nightly)

on:
  schedule:
    - cron: "0 3 * * *" # 09:00 Dhaka
  workflow_dispatch:

jobs:
  eval:
    if: github.repository_owner != 'placeholder' # enable once staging DSN secret exists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Run golden-set evaluation against staging
        working-directory: apps/api
        env:
          MIOS_TEST_DSN: ${{ secrets.STAGING_DATABASE_URL }}
          MIOS_EVAL_TENANT_ID: ${{ secrets.STAGING_EVAL_TENANT_ID }}
        run: |
          if [ -z "$MIOS_TEST_DSN" ]; then echo "STAGING_DATABASE_URL not configured; skipping"; exit 0; fi
          python ../../evals/run_eval.py
