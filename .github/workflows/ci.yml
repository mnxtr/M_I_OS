name: CI

on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mios
          POSTGRES_PASSWORD: mios-ci-only
          POSTGRES_DB: mios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mios -d mios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://mios:mios-ci-only@localhost:5432/mios_test
      MIOS_TEST_DSN: postgresql+psycopg://mios:mios-ci-only@localhost:5432/mios_test
      AUTO_CREATE_SCHEMA: 'false'
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.lock
      - name: Install
        run: pip install -c requirements.lock -e ".[dev]"
      - name: Dependency consistency
        run: pip check
      - name: Lint
        run: ruff check app tests ../../evals/run_eval.py
      - name: Fresh database migrations
        run: alembic upgrade head
      - name: Unit + database integration tests
        run: python -m pytest tests -q
        env:
          JWT_SECRET: ci-secret

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Build (type-check included)
        run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Browser and accessibility regression tests
        run: npm test
      - name: Browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: apps/web/playwright-report/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
